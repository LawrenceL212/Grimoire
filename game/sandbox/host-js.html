<!doctype html>
<meta charset="utf-8">
<!-- Sandbox host for learner JavaScript. No network at all. 'unsafe-eval' is needed for new AsyncFunction(code)
     and is acceptable because this document has an opaque origin and holds nothing. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; connect-src 'none'; worker-src blob:; frame-src 'none'; form-action 'none'; base-uri 'none'; img-src 'none'">
<title>sandbox host</title>
<script src="host.js" data-kind="js"></script>
