<!doctype html>
<meta charset="utf-8">
<!-- Sandbox host for learner PHP. Runs inside <iframe sandbox="allow-scripts"> (opaque origin).
     Network is limited to the CDN that serves php-wasm and its wasm. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; connect-src https://cdn.jsdelivr.net; worker-src blob:; frame-src 'none'; form-action 'none'; base-uri 'none'; img-src 'none'">
<title>sandbox host</title>
<script src="host.js" data-kind="php"></script>
