<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimoire: The Story Begins</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="intro.css">
</head>
<body>
<div id="app">
  <div id="sky"></div>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="layer" id="tags"></div>
  <div class="layer" id="ui">
    <section class="win" id="signup" aria-hidden="true">
      <div class="bar"><span class="dot"></span><span>register-a-company</span></div>
      <div class="form">
        <h3>Register your company</h3>
        <label>Company name<span class="field" id="f-name"></span></label>
        <label>Director<span class="field" id="f-dir"></span></label>
        <label>Registered office<span class="field" id="f-office"></span></label>
        <div class="submit" id="f-submit">Register</div>
      </div>
    </section>
    <section id="page" aria-hidden="true"><p id="page-ink"></p></section>
    <div id="title"><h1>GRIMOIRE</h1><p>Learn to code by running the company.</p></div>
    <div id="fade"></div>
    <div id="caption" role="status" aria-live="polite"><b id="cap-who"></b><span id="cap-text"></span></div>
    <button type="button" id="skip" title="Skip the intro (Esc)">Skip intro ›</button>
    <div id="start" hidden>
      <button type="button" id="start-btn"><span>▶</span> Play the intro</button>
      <p>Sound on. Captions are always shown.</p>
    </div>
    <div id="end" hidden>
      <button type="button" id="replay">↺ Watch again</button>
      <a id="onward" href="../play/index.html">Open the office ›</a>
    </div>
  </div>
</div>
<script type="module" src="intro.js"></script>
</body>
</html>
