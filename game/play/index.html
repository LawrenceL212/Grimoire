<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimoire: Open for Business</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="./play.css">
</head>
<body>
<div id="app">
  <section id="scene" aria-label="The office">
    <canvas aria-label="The office, seen from above: drag to turn, scroll or pinch to zoom"></canvas>
    <p id="gl-msg" role="alert" hidden></p>
    <p id="loading" role="status">Opening the office…</p>
  </section>
  <header id="hud"></header>

  <section id="win-ticket" aria-labelledby="ticket-id">
    <div class="bar" aria-label="Ticket"><span class="dot"></span><span id="ticket-id">TICKET</span><span class="sp"></span><span class="pill open">OPEN</span></div>
    <div class="body">
      <div class="who" id="ticket-who"></div>
      <p class="said" id="ticket-said"></p>
    </div>
  </section>

  <section id="win-code" aria-label="Code">
    <div class="bar" aria-label="Code"><span class="dot"></span><span id="code-file">bookings.sql</span><span class="sp"></span>
      <span class="tabs" role="group" aria-label="Language">
        <button type="button" class="lang-tab" data-lang="sql">SQL</button><button type="button" class="lang-tab" data-lang="js">JavaScript</button><button type="button" class="lang-tab" data-lang="php">PHP</button>
      </span>
    </div>
    <div id="editor-host"></div>
    <div class="actions">
      <button type="button" id="run" class="run" title="Run (Ctrl+Enter)">Run ▶</button>
      <button type="button" id="reset" class="reset" title="Put the world back as it was when the ticket arrived">Reset</button>
      <span class="hint">Ctrl+Enter runs</span>
    </div>
    <p id="code-note" class="note" hidden></p>
    <div id="result" role="status" aria-live="polite"></div>
  </section>
  <noscript><p class="boot-note">The game needs JavaScript.</p></noscript>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
