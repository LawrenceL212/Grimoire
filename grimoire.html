<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0A07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimoire">
<meta name="description" content="GRIMOIRE - a spellbook for mastering computer science.">
<title>GRIMOIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0A07; --surface:#141008; --elev:#1C1610;
  --gold:#C49A3C; --bronze:#8B6F3E;
  --text:#F0E6D3; --dim:#9C8B72; --faint:#6B5A45;
  --ok:#7A9E6E; --warn:#C4783C; --danger:#9E4E3C;
  --trim:rgba(196,154,60,0.15); --trim2:rgba(196,154,60,0.30);
  --shadow:0 4px 24px rgba(0,0,0,0.6);
  --serif:"Playfair Display",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.5; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 120% 80% at 50% -10%, rgba(196,154,60,0.055), transparent 60%);
  background-attachment:fixed;
}
input,select,textarea,button{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:0.01em}
.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(196,154,60,0.2);border-radius:3px}

/* layout */
.screen{display:none;padding:0 16px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.screen.on{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 64%,rgba(13,10,7,0));padding:18px 0 12px}
.topbar h1{font-size:21px;letter-spacing:0.16em;color:var(--gold);text-transform:uppercase}
.topbar .sub{font-family:var(--serif);font-style:italic;color:var(--faint);font-size:12.5px;margin-top:3px}
.topbar .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

.rule{height:1px;background:linear-gradient(90deg,transparent,var(--trim2),transparent);margin:18px 0}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--faint)}
.sectionhead{display:flex;align-items:center;gap:10px;margin:24px 0 12px}
.sectionhead:after{content:"";flex:1;height:1px;background:var(--trim)}

/* cards */
.card{
  background:linear-gradient(160deg,var(--surface),#100C06);
  border:1px solid var(--trim); border-radius:6px; box-shadow:var(--shadow);
  padding:16px; position:relative;
}
.card.elev{background:linear-gradient(160deg,var(--elev),#15100A)}
.card:before{content:"";position:absolute;inset:3px;border:1px solid rgba(196,154,60,0.07);border-radius:3px;pointer-events:none}
.card>*{position:relative}

/* library */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 13px;border-radius:3px;border:1px solid var(--trim);
  background:var(--surface);color:var(--dim);font-size:12px;font-weight:500;
  letter-spacing:0.06em;white-space:nowrap;transition:.18s
}
.chip.on{background:rgba(196,154,60,0.13);border-color:var(--trim2);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}

.tome{
  background:linear-gradient(155deg,#181209,#0F0B06);
  border:1px solid var(--trim);border-left:3px solid var(--bronze);
  border-radius:4px;padding:13px 12px 12px;text-align:left;
  box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.18s;
  display:flex;flex-direction:column;gap:8px;min-height:128px;width:100%
}
.tome:active{transform:scale(.985)}
.tome.mastered{border-left-color:var(--gold)}
.tome .tname{font-family:var(--serif);font-size:15.5px;line-height:1.22;color:var(--text);padding-right:16px}
.tome .tcat{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.tome .tfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.tome .lvl{font-family:var(--mono);font-size:10.5px;color:var(--bronze);letter-spacing:.08em}
.seal{color:var(--gold);font-size:14px;line-height:1}
.tome .seal{position:absolute;top:11px;right:10px}

.bar{height:5px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;border:1px solid rgba(0,0,0,.4)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--bronze),var(--gold));border-radius:2px;transition:width .5s ease}
.bar.tall{height:8px}

/* spells */
.spell{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid rgba(196,154,60,0.09)}
.spell:last-child{border-bottom:none}
.spell .num{
  flex:0 0 30px;height:30px;border-radius:50%;border:1px solid var(--trim2);
  display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--faint);
  background:rgba(0,0,0,.3)
}
.spell.done .num{background:rgba(196,154,60,.15);border-color:var(--gold);color:var(--gold)}
.spell.active .num{border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 3px rgba(196,120,60,.08)}
.spell .st{font-family:var(--serif);font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.spell .sd{color:var(--dim);font-size:13px;margin-top:3px;line-height:1.45}
.spell.locked .st,.spell.locked .sd{color:var(--faint)}
.spell .sx{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.1em;margin-top:6px}

/* forms */
.field{margin-bottom:16px}
.field>label{display:block;margin-bottom:7px}
.inp{
  width:100%;background:#0B0805;border:1px solid var(--trim);border-radius:4px;
  padding:13px 12px;color:var(--text);outline:none;transition:.18s;font-size:16px
}
.inp:focus{border-color:var(--trim2);background:#0E0A06}
textarea.inp{min-height:88px;resize:vertical;line-height:1.55}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8B6F3E 50%),linear-gradient(135deg,#8B6F3E 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.scale button{
  padding:14px 0;border-radius:4px;border:1px solid var(--trim);background:#0B0805;
  color:var(--dim);font-family:var(--mono);font-size:15px;transition:.15s
}
.scale button.on{background:rgba(196,154,60,.16);border-color:var(--gold);color:var(--gold)}
.hint{font-size:12px;color:var(--faint);font-style:italic;font-family:var(--serif);margin-top:7px}
.dur{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.dur button{padding:9px 0;border:1px solid var(--trim);border-radius:4px;background:#0B0805;color:var(--dim);font-family:var(--mono);font-size:12.5px}
.dur button:active{background:rgba(196,154,60,.12)}

.btn{
  width:100%;padding:15px;border-radius:4px;background:linear-gradient(180deg,#C49A3C,#A07E2E);
  color:#1A1206;font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;
  box-shadow:0 3px 14px rgba(196,154,60,.18);transition:.15s
}
.btn:active{transform:translateY(1px);filter:brightness(.94)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;border:1px solid var(--trim2);color:var(--gold);box-shadow:none;font-weight:600}
.btn.sm{padding:11px;font-size:12.5px}

/* misc */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(0,0,0,.28);border:1px solid var(--trim);border-radius:4px;padding:12px 8px;text-align:center}
.stat .v{font-family:var(--serif);font-size:22px;color:var(--gold);line-height:1.1}
.stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.entry{padding:14px 0;border-bottom:1px solid rgba(196,154,60,.09)}
.entry:last-child{border-bottom:none}
.entry .eh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.entry .et{font-family:var(--serif);font-size:15.5px}
.entry .ex{font-family:var(--mono);font-size:12px;color:var(--gold);white-space:nowrap}
.entry .em{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em;margin-top:3px}
.entry .en{color:var(--dim);font-size:13.5px;margin-top:7px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-family:var(--mono);font-size:10px;padding:3px 7px;border:1px solid var(--trim);border-radius:2px;color:var(--bronze)}
.empty{text-align:center;padding:44px 20px;color:var(--faint);font-family:var(--serif);font-style:italic;line-height:1.6}
.empty .big{font-size:26px;color:rgba(196,154,60,.32);margin-bottom:10px;font-style:normal}
.rowlist{display:flex;flex-direction:column;gap:9px}
.rowitem{display:flex;align-items:center;gap:11px;padding:11px 12px;background:rgba(0,0,0,.24);border:1px solid var(--trim);border-radius:4px;text-align:left;width:100%}
.rowitem .ri1{flex:1;min-width:0}
.rowitem .rn{font-family:var(--serif);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .rs{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.1em;margin-top:3px}

/* nav */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;
  background:linear-gradient(180deg,#191309,#0E0A06);
  border-top:1px solid var(--trim2);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 24px rgba(0,0,0,.6)
}
nav.on{display:flex}
nav button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);position:relative}
nav button .ni{font-size:17px;line-height:1}
nav button .nl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
nav button.on{color:var(--gold)}
nav button.on:before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--gold);border-radius:0 0 2px 2px}

/* sheets / auth */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.sheet.on{display:block;animation:up .26s ease}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sheet .inner{max-width:720px;margin:0 auto;padding:0 16px 60px}
.sheetbar{position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 72%,transparent);padding:16px 0 12px;display:flex;align-items:center;gap:12px;z-index:5}
.back{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.14em;padding:6px 0}

#auth{display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:24px}
#auth .box{width:100%;max-width:380px}
#auth .crest{text-align:center;margin-bottom:26px}
#auth .crest .mark{font-size:30px;color:var(--gold);letter-spacing:.2em}
#auth h1{font-size:29px;letter-spacing:.22em;color:var(--gold);margin-top:12px}
#auth .tag{font-family:var(--serif);font-style:italic;color:var(--faint);font-size:13px;margin-top:9px;line-height:1.6}
.msg{font-size:13px;padding:11px;border-radius:4px;margin-bottom:14px;display:none;line-height:1.45}
.msg.on{display:block}
.msg.err{background:rgba(158,78,60,.14);border:1px solid rgba(158,78,60,.4);color:#D9967F}
.msg.ok{background:rgba(122,158,110,.12);border:1px solid rgba(122,158,110,.35);color:var(--ok)}
.switch{text-align:center;margin-top:18px;font-size:13px;color:var(--dim)}
.switch b{color:var(--gold);cursor:pointer}
.notice{font-size:11px;color:var(--faint);text-align:center;margin-top:22px;line-height:1.7;font-family:var(--mono);letter-spacing:.04em}

#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-24px);top:14px;z-index:90;
  background:var(--elev);border:1px solid var(--trim2);color:var(--text);padding:12px 18px;border-radius:4px;
  box-shadow:var(--shadow);font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center;line-height:1.5}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .4s}
#splash .m{font-family:var(--serif);font-size:32px;color:var(--gold);letter-spacing:.24em}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="splash"><div class="m">&#10022;</div></div>
<div id="toast"></div>

<!-- ============ AUTH ============ -->
<section id="auth" class="hidden">
  <div class="box">
    <div class="crest">
      <div class="mark">&#10022;</div>
      <h1>GRIMOIRE</h1>
      <div class="tag">Every language a spell.<br>Every concept a power.</div>
    </div>
    <div class="card">
      <div id="authMsg" class="msg"></div>
      <div class="field">
        <label class="label" id="nameLbl" style="display:none">Caster name</label>
        <input id="aName" class="inp" type="text" placeholder="Caster name" autocomplete="nickname" style="display:none">
      </div>
      <div class="field">
        <label class="label">Email</label>
        <input id="aEmail" class="inp" type="email" autocomplete="email" placeholder="scholar@library.edu">
      </div>
      <div class="field">
        <label class="label">Passphrase</label>
        <input id="aPass" class="inp" type="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>
      <button id="aGo" class="btn">Enter the Library</button>
      <div class="switch" id="aSwitch">No tome of your own? <b>Inscribe one</b></div>
    </div>
    <div class="notice" id="authNotice"></div>
  </div>
</section>

<!-- ============ LIBRARY ============ -->
<section id="s-library" class="screen">
  <div class="topbar">
    <div class="row">
      <div>
        <h1>Library</h1>
        <div class="sub">The collected tomes</div>
      </div>
      <div class="label" id="libCount"></div>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="tomeGrid"></div>
</section>

<!-- ============ CAST ============ -->
<section id="s-cast" class="screen">
  <div class="topbar">
    <h1>Cast</h1>
    <div class="sub">Inscribe a session of study</div>
  </div>
  <div class="card">
    <div class="field">
      <label class="label">Tome</label>
      <select id="cTome" class="inp"></select>
    </div>
    <div class="field">
      <label class="label">Duration &mdash; minutes</label>
      <input id="cDur" class="inp mono" type="number" inputmode="numeric" min="1" max="1440" placeholder="45">
      <div class="dur">
        <button type="button" data-d="15">15</button>
        <button type="button" data-d="30">30</button>
        <button type="button" data-d="60">60</button>
        <button type="button" data-d="90">90</button>
      </div>
    </div>
    <div class="field">
      <label class="label">Difficulty</label>
      <div class="scale" id="cDiff"></div>
      <div class="hint" id="cDiffHint">&mdash;</div>
    </div>
    <div class="field">
      <label class="label">Comprehension</label>
      <div class="scale" id="cComp"></div>
      <div class="hint" id="cCompHint">&mdash;</div>
    </div>
    <div class="field">
      <label class="label">What did you study?</label>
      <textarea id="cNotes" class="inp" placeholder="Worked through generators and the itertools module; wrote a lazy file reader."></textarea>
    </div>
    <div class="field">
      <label class="label">Topics &mdash; comma separated</label>
      <input id="cTags" class="inp" type="text" placeholder="generators, itertools, laziness">
    </div>
    <div class="rule"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span class="label">Projected reward</span>
      <span class="mono" id="cXp" style="color:var(--gold);font-size:19px">0 XP</span>
    </div>
    <button id="cSave" class="btn">Cast the Spell</button>
  </div>
</section>

<!-- ============ CASTER ============ -->
<section id="s-caster" class="screen">
  <div class="topbar">
    <h1>Caster</h1>
    <div class="sub">Your standing in the order</div>
  </div>
  <div id="casterBody"></div>
</section>

<!-- ============ CHRONICLE ============ -->
<section id="s-chronicle" class="screen">
  <div class="topbar">
    <h1>Chronicle</h1>
    <div class="sub">Every session, every mastery</div>
  </div>
  <div id="chronBody"></div>
</section>

<!-- ============ TOME DETAIL ============ -->
<div id="sheet" class="sheet">
  <div class="inner">
    <div class="sheetbar"><button class="back" id="sheetBack">&larr; LIBRARY</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<nav id="nav">
  <button data-s="library"><span class="ni">&#9733;</span><span class="nl">Library</span></button>
  <button data-s="cast"><span class="ni">&#10022;</span><span class="nl">Cast</span></button>
  <button data-s="caster"><span class="ni">&#9670;</span><span class="nl">Caster</span></button>
  <button data-s="chronicle"><span class="ni">&#9776;</span><span class="nl">Chronicle</span></button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

   ===================================================================== */

/* ---------------------------------------------------------------------
   2. TOME CATALOGUE
   Each spell is "Title | what mastery at this level means".
   --------------------------------------------------------------------- */
const T = (id, name, cat, spells) => ({ id, name, cat, spells });

const TOMES = [
/* ============================ LANGUAGES ============================ */
T("python","Python","Languages",[
 "Syntax & Variables | print, types, variables, input. You can read Python and write a script that takes input and produces output.",
 "Control Flow | if/else, loops, range. You can express any branching or repeating procedure without reaching for a reference.",
 "Functions & Scope | def, return, parameters, recursion. You decompose problems into functions and reason about local vs global scope.",
 "Data Structures | lists, dicts, sets, tuples. You pick the right built-in container instinctively and know its cost.",
 "OOP | classes, inheritance, dunder methods. You model a domain with classes and make your objects behave like built-ins.",
 "File I/O & Exceptions | open, try/except, context managers. Your programs survive bad input and clean up after themselves.",
 "Modules & Packages | import, pip, virtual envs. You structure a multi-file project and ship it with reproducible dependencies.",
 "Functional Python | comprehensions, generators, decorators. You write lazy, composable code and wrap behaviour without touching it.",
 "Concurrency | threading, asyncio, multiprocessing. You choose the right concurrency model for IO-bound vs CPU-bound work.",
 "Internals | metaclasses, descriptors, CPython, C extensions. You understand how Python itself executes and can extend the interpreter."]),

T("javascript","JavaScript","Languages",[
 "Syntax & Types | variables, primitives, typeof, coercion. You read JS confidently and predict what coercion will do.",
 "Functions & Scope | hoisting, closures, arrow functions. You explain closures precisely and use them deliberately.",
 "DOM & Events | querySelector, addEventListener, bubbling. You build an interactive page without a framework.",
 "Async | callbacks, promises, async/await, fetch. You compose async work and handle failure at every step.",
 "Objects & Prototypes | prototype chain, Object methods, this. You know exactly what `this` is bound to in any call site.",
 "ES6+ | destructuring, spread, modules, iterators. You write modern idiomatic JS and author your own iterables.",
 "Browser APIs | localStorage, Web Workers, Canvas, WebSockets. You use the platform directly instead of reaching for libraries.",

/* --------------------------------------------------------------------
   3. RULES
   -------------------------------------------------------------------- */
const THRESHOLDS = [100,250,500,900,1500,2400,3800,6000,9500,15000];
const SPELL_BONUS = [50,80,120,180,260,380,550,800,1200,2000];
const DIFF_MULT = {1:0.7,2:0.85,3:1.0,4:1.2,5:1.4};
const COMP_MULT = {1:0.6,2:0.80,3:1.0,4:1.15,5:1.3};
const DIFF_WORD = {1:"Gentle reading",2:"Comfortable",3:"Solid work",4:"Demanding",5:"At the edge of ability"};
const COMP_WORD = {1:"Lost in the fog",2:"Partial grasp",3:"Understood it",4:"Clear and confident",5:"Could teach it"};
const CATEGORIES = ["All","Languages","Web","Theory","Systems","Specialisms"];

const TOME_BY_ID = {};
TOMES.forEach(function(t){
  t.spellList = t.spells.map(function(s,i){
    var p = s.split("|");
    return { n:i+1, title:p[0].trim(), desc:(p[1]||"").trim(), xp:SPELL_BONUS[i], need:THRESHOLDS[i] };
  });
  TOME_BY_ID[t.id] = t;
});

function sessionXP(dur, diff, comp){
  return Math.round(dur * (DIFF_MULT[diff]||1) * (COMP_MULT[comp]||1));
}
function casterLevel(xp){
  return Math.max(1, Math.floor(0.08 * Math.pow(Math.max(xp,0), 0.75)));
}
function xpForLevel(lvl){ return Math.ceil(Math.pow(lvl/0.08, 4/3)); }
function spellsUnlocked(xp){
  var n = 0;
  for (var i=0;i<THRESHOLDS.length;i++){ if (xp >= THRESHOLDS[i]) n++; }
  return n; // number of COMPLETED spells
}
function fmtMins(m){
  m = Math.round(m||0);
  if (m < 60) return m + "m";
  var h = Math.floor(m/60), r = m%60;
  return r ? h + "h " + r + "m" : h + "h";
}
function dayKey(d){
  d = d instanceof Date ? d : new Date(d);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function daysBetween(a,b){
  var A = new Date(a+"T00:00:00"), B = new Date(b+"T00:00:00");
  return Math.round((B-A)/86400000);
}
function fmtDate(ms){
  var d = new Date(ms);
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) +
         " &middot; " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}

   Firestore when configured, localStorage otherwise. Same interface.

var FB = { ready:false, auth:null, db:null };
var Store = null;

function firebaseConfigured(){
  return !!(firebaseConfig.apiKey && firebaseConfig.projectId && firebaseConfig.appId);
}

function initFirebase(){
  if (!firebaseConfigured()) return false;
  if (typeof firebase === "undefined") return false;
  try {
    firebase.initializeApp(firebaseConfig);
    FB.auth = firebase.auth();
    FB.db = firebase.firestore();
    FB.ready = true;
    return true;
  } catch(e){
    console.warn("Firebase init failed, falling back to local storage:", e.message);
    return false;
  }
}

/* ---- Firestore-backed store ---- */
var CloudStore = {
  mode: "cloud",
  onAuth: function(cb){ FB.auth.onAuthStateChanged(function(u){ cb(u ? {uid:u.uid, email:u.email} : null); }); },
  signIn: function(email, pass){ return FB.auth.signInWithEmailAndPassword(email, pass).then(function(c){ return {uid:c.user.uid, email:c.user.email}; }); },
  signUp: function(email, pass){ return FB.auth.createUserWithEmailAndPassword(email, pass).then(function(c){ return {uid:c.user.uid, email:c.user.email}; }); },
  signOut: function(){ return FB.auth.signOut(); },
  loadAll: function(uid){
    return Promise.all([
      FB.db.collection("users").doc(uid).get(),
      FB.db.collection("progress").doc(uid).get(),
      FB.db.collection("sessions").doc(uid).collection("log").orderBy("at","desc").limit(500).get()
    ]).then(function(r){
      return {
        profile: r[0].exists ? r[0].data() : null,
        progress: r[1].exists ? (r[1].data().tomes || {}) : {},
        sessions: r[2].docs.map(function(d){ var v = d.data(); v.id = d.id; return v; })
      };
    });
  },
  saveProfile: function(uid, profile){ return FB.db.collection("users").doc(uid).set(profile, {merge:true}); },
  saveProgress: function(uid, tomes){ return FB.db.collection("progress").doc(uid).set({tomes:tomes, updatedAt:Date.now()}, {merge:true}); },
  addSession: function(uid, s){ return FB.db.collection("sessions").doc(uid).collection("log").add(s).then(function(ref){ s.id = ref.id; return s; }); }
};

/* ---- localStorage-backed store (offline / unconfigured fallback) ---- */
var LOCAL_KEY = "grimoire.local.v1";
function lsRead(){ try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); } catch(e){ return {}; } }
function lsWrite(d){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(d)); } catch(e){ console.warn("local save failed", e); } }

var LocalStore = {
  mode: "local",
  _cb: null,
  onAuth: function(cb){
    LocalStore._cb = cb;
    var d = lsRead();
    setTimeout(function(){ cb(d.session ? {uid:d.session.uid, email:d.session.email} : null); }, 0);
  },
  signUp: function(email, pass){
    var d = lsRead(); d.users = d.users || {};
    var key = email.toLowerCase();
    if (d.users[key]) return Promise.reject({code:"auth/email-already-in-use"});
    if ((pass||"").length < 6) return Promise.reject({code:"auth/weak-password"});
    var uid = "local_" + Math.abs(hashStr(key)).toString(36);
    d.users[key] = {uid:uid, email:email, pass:hashStr(pass)};
    d.session = {uid:uid, email:email};
    lsWrite(d);
    return Promise.resolve({uid:uid, email:email});
  },
  signIn: function(email, pass){
    var d = lsRead(); d.users = d.users || {};
    var u = d.users[email.toLowerCase()];
    if (!u) return Promise.reject({code:"auth/user-not-found"});
    if (u.pass !== hashStr(pass)) return Promise.reject({code:"auth/wrong-password"});
    d.session = {uid:u.uid, email:u.email};
    lsWrite(d);
    return Promise.resolve({uid:u.uid, email:u.email});
  },
  signOut: function(){
    var d = lsRead(); delete d.session; lsWrite(d);
    if (LocalStore._cb) LocalStore._cb(null);
    return Promise.resolve();
  },
  loadAll: function(uid){
    var d = lsRead(); var s = (d.data && d.data[uid]) || {};
    return Promise.resolve({
      profile: s.profile || null,
      progress: s.progress || {},
      sessions: (s.sessions || []).slice().sort(function(a,b){ return b.at - a.at; })
    });
  },
  _slot: function(uid){
    var d = lsRead(); d.data = d.data || {}; d.data[uid] = d.data[uid] || {};
    return {d:d, s:d.data[uid]};
  },
  saveProfile: function(uid, profile){
    var x = LocalStore._slot(uid);
    x.s.profile = Object.assign({}, x.s.profile || {}, profile);
    lsWrite(x.d); return Promise.resolve();
  },
  saveProgress: function(uid, tomes){
    var x = LocalStore._slot(uid); x.s.progress = tomes; lsWrite(x.d); return Promise.resolve();
  },
  addSession: function(uid, s){
    var x = LocalStore._slot(uid);
    x.s.sessions = x.s.sessions || [];
    s.id = "l" + x.s.sessions.length + "_" + s.at;
    x.s.sessions.push(s);
    lsWrite(x.d); return Promise.resolve(s);
  }
};
function hashStr(s){
  var h = 5381;
  for (var i=0;i<s.length;i++){ h = ((h<<5) + h + s.charCodeAt(i)) | 0; }
  return h;
}

var S = {
  user: null,
  profile: null,
  progress: {},     // tomeId -> {xp, spells, sessions, minutes, lastAt}
  sessions: [],     // newest first
  screen: "library",
  filter: "All",
  openTome: null,
  cast: { tome:"", diff:0, comp:0 },
  authMode: "in",
  busy: false
};

function blankProgress(){ return { xp:0, spells:0, sessions:0, minutes:0, lastAt:0 }; }
function prog(id){ return S.progress[id] || blankProgress(); }

function totals(){
  var xp = 0, mins = 0, spells = 0, active = 0, mastered = 0;
  Object.keys(S.progress).forEach(function(id){
    var p = S.progress[id];
    if (!TOME_BY_ID[id]) return;
    xp += p.xp + (p.bonus || 0);
    mins += p.minutes;
    spells += p.spells;
    if (p.sessions > 0 && p.spells < 10) active++;
    if (p.spells >= 10) mastered++;
  });
  return { xp:Math.round(xp), mins:mins, spells:spells, active:active, mastered:mastered };
}

function toast(msg, ms){
  var t = $("toast");

  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("on"); }, ms || 2600);
}

function show(screen){
  S.screen = screen;
  ["library","cast","caster","chronicle"].forEach(function(s){
    $("s-" + s).classList.toggle("on", s === screen);
  });
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.classList.toggle("on", b.dataset.s === screen);
  });
  window.scrollTo(0,0);
  if (screen === "library") renderLibrary();
  if (screen === "cast") renderCast();
  if (screen === "caster") renderCaster();
  if (screen === "chronicle") renderChronicle();
}

/* ---- TOME DETAIL ---- */
function openTome(id){

  var t = TOME_BY_ID[id]; if (!t) return;
  var p = prog(id);

  var cur = Math.min(done, 9);
  var floor = done === 0 ? 0 : THRESHOLDS[done-1];
  var ceil = THRESHOLDS[cur];
  var pct = done >= 10 ? 100 : Math.max(0, Math.min(100, ((p.xp - floor)/(ceil - floor))*100));
  var need = done >= 10 ? 0 : Math.max(0, Math.ceil(ceil - p.xp));

  var hist = S.sessions.filter(function(s){ return s.tome === id; }).slice(0,25);

    '<div class="hint" style="margin-bottom:14px">' + (done>=10
        ? "This tome is mastered. All ten spells are yours."

        '<div class="sd">' + esc(sp.desc) + "</div>" +

             : (i===done ? "ACTIVE &middot; " + THRESHOLDS[i] + " TOME XP TO COMPLETE"
             : "SEALED &middot; " + THRESHOLDS[i] + " TOME XP")) + "</div>" +
      "</div></div>";
  }).join("") + "</div>";

  h += '<div class="sectionhead"><span class="label">Sessions in this tome</span></div>';
  h += '<div class="card">' + (hist.length ? hist.map(entryHTML).join("") :

  $("sheetBody").innerHTML = h;

function renderCaster(){
  var t = totals();
  var lvl = casterLevel(t.xp);
  var base = xpForLevel(lvl), next = xpForLevel(lvl+1);
  var pct = Math.max(0, Math.min(100, ((t.xp - base) / Math.max(1,(next - base))) * 100));
  var name = (S.profile && S.profile.name) || (S.user && S.user.email ? S.user.email.split("@")[0] : "Scholar");

  var byCat = {};
  Object.keys(S.progress).forEach(function(id){
    var tm = TOME_BY_ID[id]; if (!tm) return;
    byCat[tm.cat] = byCat[tm.cat] || {mins:0, xp:0};
    byCat[tm.cat].mins += S.progress[id].minutes;
    byCat[tm.cat].xp += S.progress[id].xp;
  });
  var cats = Object.keys(byCat).filter(function(c){ return byCat[c].mins > 0; })
    .sort(function(a,b){ return byCat[b].mins - byCat[a].mins; });
  var maxMins = cats.length ? byCat[cats[0]].mins : 1;

  var activeTomes = Object.keys(S.progress)
    .filter(function(id){ return TOME_BY_ID[id] && S.progress[id].sessions > 0 && S.progress[id].spells < 10; })
    .sort(function(a,b){ return S.progress[b].lastAt - S.progress[a].lastAt; }).slice(0,6);

  var masteredSpells = S.sessions.filter(function(s){ return s.completed && s.completed.length; })
    .slice(0,8).reduce(function(acc,s){
      s.completed.forEach(function(n){
        var tm = TOME_BY_ID[s.tome];
        if (tm && acc.length < 6) acc.push({tome:tm.name, sp:tm.spellList[n-1], at:s.at});
      });
      return acc;
    }, []);

  var h = "";
  h += '<div class="card elev">' +
    '<div style="display:flex;align-items:center;gap:14px">' +
      '<div style="width:56px;height:56px;border-radius:50%;border:1px solid var(--trim2);display:grid;place-items:center;background:rgba(196,154,60,.08)">' +
        '<span style="font-family:var(--serif);font-size:22px;color:var(--gold)">' + esc(name.charAt(0).toUpperCase()) + "</span></div>" +
      "<div style=\"flex:1;min-width:0\">" +
        '<h2 style="font-size:22px">' + esc(name) + "</h2>" +
        '<div class="label" style="margin-top:4px">Caster Level ' + lvl + "</div>" +
      "</div>" +
      '<div style="text-align:right"><div style="font-family:var(--serif);font-size:26px;color:var(--gold);line-height:1">' + t.xp + '</div><div class="k label">Total XP</div></div>' +
    "</div>" +
    '<div class="bar tall" style="margin-top:16px"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
    '<div class="label" style="margin-top:7px;display:flex;justify-content:space-between"><span>Level ' + lvl + "</span><span>" + Math.max(0, next - t.xp) + " XP to " + (lvl+1) + "</span></div>" +
  "</div>";

  h += '<div class="stats" style="margin-top:12px">' +
    '<div class="stat"><div class="v">' + ((S.profile && S.profile.streak) || 0) + '</div><div class="k">Day Streak</div></div>' +
    '<div class="stat"><div class="v">' + fmtMins(t.mins) + '</div><div class="k">Time Invested</div></div>' +
    '<div class="stat"><div class="v">' + S.sessions.length + '</div><div class="k">Sessions</div></div>' +
  "</div>";
  h += '<div class="stats" style="margin-top:10px">' +
    '<div class="stat"><div class="v">' + t.spells + '</div><div class="k">Spells Cast</div></div>' +
    '<div class="stat"><div class="v">' + t.mastered + '</div><div class="k">Tomes Mastered</div></div>' +
    '<div class="stat"><div class="v">' + t.active + '</div><div class="k">Active Tomes</div></div>' +
  "</div>";

  h += '<div class="sectionhead"><span class="label">Time by discipline</span></div>';
  h += '<div class="card">' + (cats.length ? cats.map(function(c){
      return '<div style="margin-bottom:14px">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:6px">' +
          '<span style="font-family:var(--serif);font-size:14.5px">' + c + "</span>" +
          '<span class="mono" style="font-size:11.5px;color:var(--dim)">' + fmtMins(byCat[c].mins) + "</span></div>" +
        '<div class="bar"><i style="width:' + ((byCat[c].mins/maxMins)*100).toFixed(1) + '%"></i></div></div>';
    }).join("") : '<div class="empty"><div class="big">&#9670;</div>No time recorded yet.</div>') + "</div>";

  h += '<div class="sectionhead"><span class="label">Active tomes</span></div>';
  h += '<div class="card">' + (activeTomes.length ? '<div class="rowlist">' + activeTomes.map(function(id){
      var tm = TOME_BY_ID[id], p = S.progress[id];
      var cur = Math.min(p.spells,9), floor = p.spells===0?0:THRESHOLDS[p.spells-1], ceil = THRESHOLDS[cur];
      var pc = Math.max(0,Math.min(100,((p.xp-floor)/(ceil-floor))*100));
      return '<button class="rowitem" data-t="' + id + '">' +
        '<div class="ri1"><div class="rn">' + esc(tm.name) + "</div>" +
        '<div class="rs">SPELL ' + (p.spells+1) + "/10 &middot; " + Math.round(p.xp) + " XP</div>" +
        '<div class="bar" style="margin-top:7px"><i style="width:' + pc.toFixed(1) + '%"></i></div></div>' +
        '<span class="lvl mono" style="color:var(--faint);font-size:11px">' + fmtMins(p.minutes) + "</span></button>";
    }).join("") + "</div>" : '<div class="empty"><div class="big">&#10022;</div>No tome opened yet.<br>Cast your first session.</div>') + "</div>";

  h += '<div class="sectionhead"><span class="label">Recently mastered spells</span></div>';
  h += '<div class="card">' + (masteredSpells.length ? masteredSpells.map(function(m){
      return '<div class="entry"><div class="eh"><span class="et">' + esc(m.sp.title) + '</span><span class="ex">&#10022;</span></div>' +
        '<div class="em">' + esc(m.tome).toUpperCase() + " &middot; SPELL " + m.sp.n + " &middot; " + fmtDate(m.at) + "</div></div>";
    }).join("") : '<div class="empty"><div class="big">&#10003;</div>No spells completed yet.<br>The first is 100 XP away.</div>') + "</div>";

  h += '<div class="rule"></div>';
  h += '<div class="label" style="text-align:center;margin-bottom:12px">' + esc((S.user && S.user.email) || "") +
       " &middot; " + (Store && Store.mode === "cloud" ? "SYNCED" : "LOCAL ONLY") + "</div>";
  h += '<button class="btn ghost" id="signOut">Leave the Library</button>';

  $("casterBody").innerHTML = h;
  $("signOut").onclick = doSignOut;
  Array.prototype.forEach.call($("casterBody").querySelectorAll(".rowitem"), function(b){
    b.onclick = function(){ openTome(b.dataset.t); };
  });
}

/* ---- CHRONICLE ---- */
function entryHTML(s){
  var tm = TOME_BY_ID[s.tome];
  var tags = (s.tags || []).map(function(t){ return '<span class="tag">' + esc(t) + "</span>"; }).join("");
  var completions = (s.completed || []).map(function(n){
    var sp = tm && tm.spellList[n-1];
    return sp ? '<div style="margin-top:9px;padding:9px 11px;background:rgba(196,154,60,.07);border:1px solid var(--trim);border-radius:3px">' +
      '<span class="seal">&#10022;</span> <span style="font-family:var(--serif);font-size:14px">Spell ' + n + " &mdash; " + esc(sp.title) + "</span>" +
      '<div class="em" style="margin-top:2px">' + (n===10 ? "TOME MASTERED &middot; +" : "COMPLETED &middot; +") + sp.xp + " XP</div></div>" : "";
  }).join("");
  return '<div class="entry">' +
    '<div class="eh"><span class="et">' + esc(tm ? tm.name : s.tome) + '</span><span class="ex">+' + s.xp + " XP</span></div>" +
    '<div class="em">' + fmtDate(s.at) + " &middot; " + fmtMins(s.duration) + " &middot; DIFF " + s.difficulty + " &middot; COMP " + s.comprehension + "</div>" +
    (s.notes ? '<div class="en">' + esc(s.notes) + "</div>" : "") +
    (tags ? '<div class="tags">' + tags + "</div>" : "") +
    completions +
  "</div>";
}
function renderChronicle(){
  if (!S.sessions.length){
    $("chronBody").innerHTML = '<div class="card"><div class="empty"><div class="big">&#9776;</div>' +
      "The chronicle is blank.<br>Cast a session and it will be written here.</div></div>";
    return;
  }
  var groups = {};
  S.sessions.forEach(function(s){ (groups[dayKey(s.at)] = groups[dayKey(s.at)] || []).push(s); });
  var keys = Object.keys(groups).sort().reverse();
  var today = dayKey(new Date());
  var h = keys.map(function(k){
    var d = groups[k];
    var mins = d.reduce(function(a,s){ return a + s.duration; },0);
    var xp = d.reduce(function(a,s){ return a + s.xp; },0);
    var lbl = k === today ? "Today" : (daysBetween(k,today) === 1 ? "Yesterday"
      : new Date(k+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}));
    return '<div class="sectionhead"><span class="label">' + lbl + " &middot; " + fmtMins(mins) + " &middot; " + xp + " XP</span></div>" +
      '<div class="card">' + d.map(entryHTML).join("") + "</div>";
  }).join("");
  $("chronBody").innerHTML = h;
}

/* --------------------------------------------------------------------
   7. CASTING A SESSION
   -------------------------------------------------------------------- */
function castSession(){
  if (S.busy) return;
  var tome = $("cTome").value;
  var dur = parseInt($("cDur").value,10);
  var notes = $("cNotes").value.trim();
  var tags = $("cTags").value.split(",").map(function(t){ return t.trim(); }).filter(Boolean).slice(0,8);

  if (!tome) return toast("Choose a tome first.");
  if (!dur || dur < 1) return toast("Enter a duration in minutes.");
  if (dur > 1440) return toast("That is more than a day of study.");
  if (!S.cast.diff) return toast("Rate the difficulty.");
  if (!S.cast.comp) return toast("Rate your comprehension.");

  S.busy = true;
  $("cSave").disabled = true;

  var xp = sessionXP(dur, S.cast.diff, S.cast.comp);
  var now = Date.now();
  var p = Object.assign(blankProgress(), S.progress[tome] || {});
  var before = p.spells;
  p.xp = Math.round(p.xp + xp);
  p.minutes += dur;
  p.sessions += 1;
  p.lastAt = now;
  var after = Math.max(before, spellsUnlocked(p.xp));
  var completed = [];
  var bonus = 0;
  for (var i = before; i < after; i++){ completed.push(i+1); bonus += SPELL_BONUS[i]; }
  p.spells = after;
  p.bonus = (p.bonus || 0) + bonus;
  S.progress[tome] = p;

  // streak
  var pf = S.profile || {};
  var today = dayKey(now);
  if (pf.lastDay !== today){
    if (pf.lastDay && daysBetween(pf.lastDay, today) === 1) pf.streak = (pf.streak || 0) + 1;
    else pf.streak = 1;
    pf.lastDay = today;
  }
  pf.streak = pf.streak || 1;
  var tt = totals();
  pf.totalXP = tt.xp;
  pf.level = casterLevel(tt.xp);
  pf.totalMinutes = tt.mins;
  pf.totalSessions = S.sessions.length + 1;
  pf.updatedAt = now;
  if (!pf.createdAt) pf.createdAt = now;
  if (!pf.email && S.user) pf.email = S.user.email;
  S.profile = pf;

  var session = {
    tome: tome, duration: dur, difficulty: S.cast.diff, comprehension: S.cast.comp,
    notes: notes, tags: tags, xp: xp, bonusXP: bonus, completed: completed, at: now
  };

  Store.addSession(S.user.uid, session).then(function(saved){
    S.sessions.unshift(saved || session);
    return Promise.all([
      Store.saveProgress(S.user.uid, S.progress),
      Store.saveProfile(S.user.uid, S.profile)
    ]);
  }).then(function(){
    var tm = TOME_BY_ID[tome];
    var msg = "+" + xp + " XP inscribed";
    if (completed.length){
      var last = completed[completed.length-1];
      msg = last === 10
        ? "&#9670; " + esc(tm.name) + " MASTERED<br><span style=\"color:var(--dim);font-size:12px\">All ten spells are yours.</span>"
        : "&#10022; Spell " + last + " complete<br><span style=\"color:var(--dim);font-size:12px\">" + esc(tm.spellList[last-1].title) + "</span>";
      toast(msg, 4200);
    } else {
      toast(msg);
    }
    // reset form
    $("cDur").value = ""; $("cNotes").value = ""; $("cTags").value = "";
    S.cast.diff = 0; S.cast.comp = 0;
    renderScales(); updateXpPreview();
    show("chronicle");
  }).catch(function(e){
    console.error("Failed to save session:", e);
    toast("Could not save the session. " + (e && e.message ? esc(e.message) : ""), 4000);
  }).then(function(){
    S.busy = false;
    $("cSave").disabled = false;
  });
}

/* --------------------------------------------------------------------
   8. AUTH FLOW
   -------------------------------------------------------------------- */
function authMsg(text, kind){
  var m = $("authMsg");
  if (!text){ m.className = "msg"; m.textContent = ""; return; }
  m.className = "msg on " + (kind || "err");
  m.innerHTML = text;
}
function setAuthMode(mode){
  S.authMode = mode;
  var up = mode === "up";
  $("aName").style.display = up ? "" : "none";
  $("nameLbl").style.display = up ? "" : "none";
  $("aPass").setAttribute("autocomplete", up ? "new-password" : "current-password");
  $("aGo").textContent = up ? "Inscribe Your Grimoire" : "Enter the Library";
  $("aSwitch").innerHTML = up ? "Already inscribed? <b>Sign in</b>" : "No tome of your own? <b>Inscribe one</b>";
  authMsg("");
}
function authError(e){
  var c = (e && e.code) || "";
  var map = {
    "auth/invalid-email":"That email address is not valid.",
    "auth/user-not-found":"No caster is inscribed under that email.",
    "auth/wrong-password":"That passphrase does not match.",
    "auth/invalid-credential":"Email or passphrase is incorrect.",
    "auth/email-already-in-use":"That email is already inscribed. Sign in instead.",
    "auth/weak-password":"Choose a passphrase of at least 6 characters.",
    "auth/too-many-requests":"Too many attempts. Wait a moment and try again.",
    "auth/network-request-failed":"No connection to the library.",
    "auth/operation-not-allowed":"Email/password sign-in is not enabled. Firebase console → Authentication → Sign-in method → enable Email/Password.",
    "auth/configuration-not-found":"Authentication is not set up for this Firebase project. Firebase console → Authentication → Get started → enable Email/Password.",
    "auth/missing-password":"Enter a passphrase.",
    "auth/unauthorized-domain":"This domain is not authorised. Firebase console → Authentication → Settings → Authorised domains."
  };
  return map[c] || (e && e.message) || "Something went wrong.";
}
function doAuth(){
  var email = $("aEmail").value.trim();
  var pass = $("aPass").value;
  var name = $("aName").value.trim();
  if (!email || !pass) return authMsg("Enter an email and passphrase.");
  $("aGo").disabled = true;
  authMsg("");
  var p = S.authMode === "up" ? Store.signUp(email, pass) : Store.signIn(email, pass);
  p.then(function(u){
    if (S.authMode === "up"){
      return Store.saveProfile(u.uid, {
        name: name || email.split("@")[0], email: email, totalXP:0, level:1,
        streak:0, lastDay:null, totalMinutes:0, totalSessions:0, createdAt: Date.now()
      }).then(function(){ return u; });
    }
    return u;
  }).then(function(u){
    if (Store.mode === "local") enterApp(u);
  }).catch(function(e){
    authMsg(esc(authError(e)));
  }).then(function(){
    $("aGo").disabled = false;
  });
}
function doSignOut(){
  Store.signOut().then(function(){
    S.user = null; S.profile = null; S.progress = {}; S.sessions = [];
    $("nav").classList.remove("on");
    Array.prototype.forEach.call(document.querySelectorAll(".screen"), function(s){ s.classList.remove("on"); });
    closeSheet();
    $("auth").classList.remove("hidden");
    $("aPass").value = "";
    setAuthMode("in");
  });
}

function enterApp(user){
  S.user = user;
  $("auth").classList.add("hidden");
  Store.loadAll(user.uid).then(function(d){
    S.profile = d.profile || { name: user.email.split("@")[0], email:user.email, streak:0, lastDay:null, createdAt:Date.now() };
    S.progress = d.progress || {};
    S.sessions = d.sessions || [];
    // streak decay: broken if the last day is older than yesterday
    var today = dayKey(new Date());
    if (S.profile.lastDay && daysBetween(S.profile.lastDay, today) > 1) S.profile.streak = 0;
    $("nav").classList.add("on");
    show("library");
  }).catch(function(e){
    console.error("Load failed:", e);
    S.profile = { name: user.email.split("@")[0], email:user.email, streak:0 };
    S.progress = {}; S.sessions = [];
    $("nav").classList.add("on");
    show("library");
    toast("Could not read your grimoire. Check Firestore rules.", 4500);
  });
}

/* --------------------------------------------------------------------
   9. WIRING
   -------------------------------------------------------------------- */
function wire(){
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.onclick = function(){ show(b.dataset.s); };
  });
  $("filters").addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if (!b) return;
    S.filter = b.dataset.f; renderLibrary();
  });
  $("tomeGrid").addEventListener("click", function(e){
    var b = e.target.closest(".tome"); if (!b) return;
    openTome(b.dataset.t);
  });
  $("sheetBack").onclick = closeSheet;
  $("cTome").addEventListener("change", function(){ S.cast.tome = this.value; });
  $("cDur").addEventListener("input", updateXpPreview);
  document.querySelector(".dur").addEventListener("click", function(e){
    var b = e.target.closest("button[data-d]"); if (!b) return;
    $("cDur").value = b.dataset.d; updateXpPreview();
  });
  ["cDiff","cComp"].forEach(function(id){
    $(id).addEventListener("click", function(e){
      var b = e.target.closest("button[data-v]"); if (!b) return;
      S.cast[b.dataset.k] = parseInt(b.dataset.v,10);
      renderScales(); updateXpPreview();
    });
  });
  $("cSave").onclick = castSession;
  $("aGo").onclick = doAuth;
  $("aSwitch").onclick = function(){ setAuthMode(S.authMode === "in" ? "up" : "in"); };
  $("aPass").addEventListener("keydown", function(e){ if (e.key === "Enter") doAuth(); });
  $("aEmail").addEventListener("keydown", function(e){ if (e.key === "Enter") $("aPass").focus(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && S.openTome) closeSheet(); });
}

/* ---- PWA manifest, generated inline so this stays one file ---- */
function installManifest(){
  try {
    var icon = "data:image/svg+xml;base64," + btoa(
      '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">' +
      '<rect width="512" height="512" fill="#0D0A07"/>' +
      '<text x="256" y="330" font-family="Georgia,serif" font-size="300" fill="#C49A3C" text-anchor="middle">&#10022;</text></svg>');
    var manifest = {
      name:"GRIMOIRE", short_name:"Grimoire",
      description:"Every language a spell. Every concept a power.",
      start_url:".", scope:".", display:"standalone",
      background_color:"#0D0A07", theme_color:"#0D0A07", orientation:"portrait",
      icons:[{src:icon, sizes:"512x512", type:"image/svg+xml", purpose:"any maskable"}]
    };
    var url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"}));
    var link = document.createElement("link");
    link.rel = "manifest"; link.href = url;
    document.head.appendChild(link);
    var fav = document.createElement("link");
    fav.rel = "icon"; fav.href = icon;
    document.head.appendChild(fav);
  } catch(e){ /* manifest is a nicety, never fatal */ }
}

/* ---- boot ---- */
function boot(){
  installManifest();
  wire();
  setAuthMode("in");

  var cloud = initFirebase();
  Store = cloud ? CloudStore : LocalStore;
  $("authNotice").innerHTML = cloud
    ? "SYNCED TO FIRESTORE"
    : "LOCAL MODE &middot; ADD YOUR firebaseConfig<br>AT THE TOP OF THIS FILE TO SYNC";

  Store.onAuth(function(user){
    var sp = $("splash");
    sp.style.opacity = "0";
    setTimeout(function(){ sp.remove(); }, 420);
    if (user) enterApp(user);
    else $("auth").classList.remove("hidden");
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
